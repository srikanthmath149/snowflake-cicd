
name: Snowflake-devops-CICD

# Configure triggers
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'migrations/**'

  # Manual execution
  workflow_dispatch:

jobs:
  deploy-snowflake-changes-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install schemachange
      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      # Step 4: Verify installation
      - name: Verify schemachange
        run: |
          python --version
          schemachange --version

      # Step 5: Deploy Snowflake changes
      - name: Run schemachange Deployment
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}

        run: |
          echo "Workspace Root Path: $GITHUB_WORKSPACE"

          schemachange \
            -f $GITHUB_WORKSPACE/migrations \
            -a $SF_ACCOUNT \
            -u $SF_USERNAME \
            -r $SF_ROLE \
            -w $SF_WAREHOUSE \
            -d $SF_DATABASE \
            -c $SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY \
            --create-change-history-table
