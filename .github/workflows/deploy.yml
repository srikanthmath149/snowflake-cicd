name: Snowflake-devops-CICD

# Workflow triggers
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'migrations/**'

  workflow_dispatch:

jobs:
  deploy-snowflake-changes-job:

    name: Deploy Snowflake Migrations

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # STEP 1: Checkout Repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------
      # STEP 2: Setup Python
      # -----------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # -----------------------------------------
      # STEP 3: Install schemachange
      # -----------------------------------------
      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange==4.4.0

      # -----------------------------------------
      # STEP 4: Verify Installation
      # -----------------------------------------
      - name: Verify schemachange
        run: |
          python --version
          schemachange --version

      # -----------------------------------------
      # STEP 5: Prepare isolated configuration
      # -----------------------------------------
      - name: Prepare schemachange config
        run: |
          mkdir -p /tmp/schemachange-empty-config

          echo "Isolated configuration directory created"

      # -----------------------------------------
      # STEP 6: Check Migration Files
      # -----------------------------------------
      - name: Check migration files
        run: |
          echo "Available migration files:"

          find migrations -type f -name "*.sql" -print

          if [ ! -d migrations ]; then
            echo "ERROR: migrations folder not found"
            exit 1
          fi

          if ! find migrations -type f -name "*.sql" | grep -q .; then
            echo "ERROR: No SQL migration files found"
            exit 1
          fi

      # -----------------------------------------
      # STEP 7: Deploy Snowflake Changes
      # -----------------------------------------
      - name: Run schemachange Deployment

        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SF_USERNAME }}
          SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}

        run: |

          echo "=================================="
          echo "Starting Snowflake CI/CD Deployment"
          echo "=================================="

          schemachange deploy \
            --config-folder /tmp/schemachange-empty-config \
            -f "$GITHUB_WORKSPACE/migrations" \
            -a "$SNOWFLAKE_ACCOUNT" \
            -u "$SNOWFLAKE_USER" \
            -r "$SNOWFLAKE_ROLE" \
            -w "$SNOWFLAKE_WAREHOUSE" \
            -d "$SNOWFLAKE_DATABASE" \
            -c "$SNOWFLAKE_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --schemachange-create-change-history-table \
            -L DEBUG

          echo "=================================="
          echo "Snowflake Deployment Completed"
          echo "=================================="
