name: snowflake-devops-demo

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'migrations/**'
  workflow_dispatch:

# Only one deployment at a time; don't cancel a deploy that's mid-flight
concurrency:
  group: snowflake-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-snowflake-changes-job:
    runs-on: ubuntu-latest
    environment: Development
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install "schemachange>=4,<5"

      - name: Run schemachange deployment
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          echo "Workspace root path: $GITHUB_WORKSPACE"
          schemachange deploy \
            --root-folder "$GITHUB_WORKSPACE/migrations" \
            --snowflake-account "$SF_ACCOUNT" \
            --snowflake-user "$SF_USERNAME" \
            --snowflake-role "$SF_ROLE" \
            --snowflake-warehouse "$SF_WAREHOUSE" \
            --snowflake-database "$SF_DATABASE" \
            --change-history-table "$SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table
